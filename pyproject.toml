[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ukrainian-crf-postag"
version = "0.1.0"
description = "Ukrainian semi-supervised CRF part-of-speech tagger"
requires-python = ">=3.14,<3.15"
dependencies = [
    "conllu>=6,<7",
    "joblib>=1.5,<2",
    "numpy>=2.3,<3",
    "pandas>=2.3,<4",
    "psutil>=7,<8",
    "PyYAML>=6.0.3,<7",
    "scikit-learn>=1.7,<2",
    "sklearn-crfsuite>=0.5,<0.6",
    "tokenize-uk==2.0.0",
]

[dependency-groups]
dev = [
    "mypy>=1.18,<2",
    "pytest>=8.4,<10",
    "ruff>=0.14,<1",
    "types-PyYAML>=6.0.12",
    "types-psutil>=7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/crf"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/crf",
    "/tests",
    "/scripts/preview_tokenization.py",
    "/docs",
    "/AGENTS.md",
    "/PLAN.md",
    "/.python-version",
    "/pyproject.toml",
    "/uv.lock",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = ["integration: integration coverage with dependencies documented in the test module"]
